<!doctype html>
<!-- Deployment refresh: latest Week 2 and Week 3 journal revisions -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Design Technology foundation journal — Yuwen Wang</title>
    <meta name="description" content="Design Technology foundation journal by Yuwen Wang">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='white'/%3E%3Crect x='7' y='7' width='18' height='18' fill='%23232323'/%3E%3C/svg%3E">
    <style>
      * { box-sizing: border-box; }

      html, body { margin: 0; min-height: 100%; }

      body {
        background: #fff;
        color: #242424;
        font-family: "Times New Roman", Times, serif;
        padding: 33px 38px 80px;
      }

      a { color: inherit; text-decoration: none; }

      .masthead {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-items: baseline;
        column-gap: 24px;
        padding-bottom: 9px;
        border-bottom: 1px solid #707070;
      }

      .masthead h1 {
        margin: 0;
        font-size: clamp(2.25rem, 3.35vw, 4.15rem);
        line-height: 1;
        font-weight: 700;
        letter-spacing: -0.035em;
      }

      .masthead .name { white-space: nowrap; }

      .masthead .title-part { white-space: nowrap; }
      .masthead .title-part:nth-child(2) { text-align: center; }
      .masthead .title-part:last-child { text-align: right; }

      main { padding-top: 39px; }

      .section-title {
        margin: 0 0 43px;
        font-size: 1.84rem;
        line-height: 1;
        font-weight: 400;
      }

      .journal-list {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 30px;
      }

      .entry {
        font-size: 1.75rem;
        line-height: 1.1;
      }

      .entry-label {
        display: flex;
        align-items: center;
        gap: 13px;
      }

      .square {
        display: inline-block;
        width: 20px;
        height: 20px;
        flex: 0 0 20px;
        background: #262626;
      }

      .code-crop {
        position: relative;
        width: 315px;
        height: 100px;
        margin-top: 3px;
        overflow: hidden;
      }

      .code-crop img {
        position: absolute;
        width: 1512px;
        max-width: none;
        left: -38px;
        top: -352px;
      }

      @media (max-width: 720px) {
        body { padding: 24px 20px 60px; }

        .masthead {
          grid-template-columns: 1fr;
          row-gap: 8px;
        }

        .masthead h1 {
          font-size: clamp(2rem, 10vw, 3rem);
          line-height: 1.02;
        }

        .masthead .title-part { text-align: left; white-space: normal; }
        .masthead .name { white-space: normal; }
        main { padding-top: 32px; }
        .section-title { margin-bottom: 38px; font-size: 1.55rem; }
        .entry { font-size: 1.45rem; }
        .square { width: 17px; height: 17px; flex-basis: 17px; }
      }
    </style>
  </head>
  <body>
    <header class="masthead">
      <h1 class="title-part"><a href="/">Design Technology</a></h1>
      <h1 class="title-part"><a href="/">foundation journal</a></h1>
      <h1 class="title-part name"><a href="/">Yuwen Wang</a></h1>
    </header>

    <main>
      <h2 class="section-title">COMPUTATION</h2>

      <nav class="journal-list" aria-label="Journal entries">
        <div class="entry">
          <a class="entry-label" href="week-2.html"><span class="square" aria-hidden="true"></span><span>Week 2 -- Mini Me</span></a>
          <div class="code-crop" aria-label="Week 2 code preview">
            <img src="assets/reference-home.png" alt="A cropped code sample with three face images">
          </div>
        </div>

        <a class="entry entry-label" href="week-3.html"><span class="square" aria-hidden="true"></span><span>Week 3</span></a>
        <a class="entry entry-label" href="#"><span class="square" aria-hidden="true"></span><span>Week 4</span></a>
      </nav>
    </main>
  </body>
</html>
